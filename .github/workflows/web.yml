name: Web build

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "corpus/manifest.json"
      - ".github/workflows/web.yml"
  pull_request:
    branches: [main]
    paths:
      - "web/**"
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy to GitHub Pages"
        type: boolean
        default: false
      run_e2e:
        description: "Run Playwright e2e (requires the M1 corpus on the runner — only meaningful on a self-hosted runner today)"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build web/
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Type-check
        working-directory: web
        run: pnpm run check
      - name: Test
        working-directory: web
        run: pnpm run test
      - name: Build
        working-directory: web
        run: pnpm run build
      # Playwright e2e needs the M1 corpus (corpus/normalized/, ~110 MB
      # of MusicXML — gitignored). The hosted runner has no way to
      # regenerate it without running the full M1 pipeline, so the
      # render-smoke + TTI specs only run when explicitly requested via
      # `workflow_dispatch` (presumably on a runner that has the corpus).
      # Day-to-day CI value comes from typecheck + unit tests + build.
      - name: Install Playwright browsers
        if: github.event_name == 'workflow_dispatch' && inputs.run_e2e
        working-directory: web
        run: pnpm exec playwright install --with-deps chromium
      - name: Run e2e render smoke
        if: github.event_name == 'workflow_dispatch' && inputs.run_e2e
        working-directory: web
        run: pnpm run test:e2e
      - name: Regenerate render report
        if: github.event_name == 'workflow_dispatch' && inputs.run_e2e
        working-directory: web
        run: pnpm run report:e2e
      - name: Upload Playwright report
        if: github.event_name == 'workflow_dispatch' && inputs.run_e2e && always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 14
      - name: Upload artifact
        if: github.event_name == 'workflow_dispatch' && inputs.deploy
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name == 'workflow_dispatch' && inputs.deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
