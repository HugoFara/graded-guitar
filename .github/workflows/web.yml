name: Web build

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "corpus/manifest.json"
      - ".github/workflows/web.yml"
  pull_request:
    branches: [main]
    paths:
      - "web/**"
  workflow_dispatch:
    inputs:
      run_e2e:
        description: "Run Playwright e2e (requires the M1 corpus on the runner — only meaningful on a self-hosted runner today)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build web/
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Type-check
        working-directory: web
        run: pnpm run check
      - name: Test
        working-directory: web
        run: pnpm run test
      - name: Build
        working-directory: web
        run: pnpm run build
      # Playwright e2e needs the M1 corpus (corpus/normalized/, ~110 MB
      # of MusicXML — gitignored). The hosted runner has no way to
      # regenerate it without running the full M1 pipeline, so the
      # render-smoke + TTI specs only run when explicitly requested via
      # `workflow_dispatch` (presumably on a runner that has the corpus).
      # Day-to-day CI value comes from typecheck + unit tests + build.
      - name: Install Playwright browsers
        if: github.event_name == 'workflow_dispatch' && inputs.run_e2e
        working-directory: web
        run: pnpm exec playwright install --with-deps chromium
      - name: Run e2e render smoke
        if: github.event_name == 'workflow_dispatch' && inputs.run_e2e
        working-directory: web
        run: pnpm run test:e2e
      - name: Regenerate render report
        if: github.event_name == 'workflow_dispatch' && inputs.run_e2e
        working-directory: web
        run: pnpm run report:e2e
      - name: Upload Playwright report
        if: github.event_name == 'workflow_dispatch' && inputs.run_e2e && always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 14

# Pages deploys happen from a developer machine via `pnpm deploy:local`
# inside web/, not from this workflow. The CI runner has no
# `corpus/normalized/` (gitignored, ~110 MB) so its `dist/` would ship
# a music-less site. See web/scripts/deploy-local.mjs + ADR 0011.
